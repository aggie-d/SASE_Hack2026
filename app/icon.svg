  <!-- Signature LT Monogram -->
  <text x="24" y="33" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="22" fill="url(#goldGrad)" letter-spacing="-0.8">LT</text>
