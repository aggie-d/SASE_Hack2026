<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F" />
      <stop offset="50%" stop-color="#DFB338" />
      <stop offset="100%" stop-color="#B8911E" />
    </linearGradient>
  </defs>
  <!-- Dark Navy Container Matching Site Theme -->
  <rect width="48" height="48" rx="12" fill="#0B1528" />
